
<!DOCTYPE html>
<html>
<head>
    <title>Super Over</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #10151b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .stadium {
            width: 95%;
            max-width: 880px;
            height: 480px;
            border: 2px solid white;
            border-radius: 9px;
            overflow: hidden;
            background: linear-gradient(
                to bottom,
                #071a30,
                #102b43,
                #263b35,
                #061900
            );
            position: relative;
        }

        .logo {
            text-align: center;
            color: white;
            font-size: 19px;
            font-weight: bold;
            margin-top: 22px;
        }

        .score-container {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 50px;
        }

        .score-card {
            width: 280px;
            height: 223px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }

        .india {
            background-color: #0860b9;
        }

        .pakistan {
            background-color: #269c24;
        }

        h1 {
            font-size: 52px;
            margin: 28px 0 25px;
        }

        .balls {
            display: flex;
            gap: 6px;
        }

        .ball {
            width: 31px;
            height: 31px;
            border-radius: 50%;
            background-color: white;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .total {
            font-size: 30px;
            font-weight: bold;
            margin-top: 17px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-top: 48px;
        }

        button {
            height: 62px;
            width: 62px;
            border: 3px solid white;
            border-radius: 20px;
            color: white;
            font-size: 35px;
        }

        .edit {
            background-color: orange;
        }

        .reset {
            background-color: red;
        }

        @media(max-width: 650px) {
            .score-container {
                gap: 12px;
            }

            .score-card {
                width: 44%;
            }

            h1 {
                font-size: 36px;
            }

            .balls {
                gap: 3px;
            }

            .ball {
                width: 23px;
                height: 23px;
                font-size: 14px;
            }

            .total {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="stadium">

        <div class="logo">
            🏏 SUPER
            <br>
            OVER
        </div>

        <div class="score-container">

            <div class="score-card india">

                <h1>IND</h1>

                <div class="balls">
                    <div class="ball">4</div>
                    <div class="ball">3</div>
                    <div class="ball">2</div>
                    <div class="ball">6</div>
                    <div class="ball">6</div>
                    <div class="ball">6</div>
                </div>

                <div class="total">27 / 0</div>

            </div>

            <div class="score-card pakistan">

                <h1>PAK</h1>

                <div class="balls">
                    <div class="ball">2</div>
                    <div class="ball">4</div>
                    <div class="ball">0</div>
                    <div class="ball">3</div>
                    <div class="ball">1</div>
                    <div class="ball">4</div>
                </div>

                <div class="total">14 / 0</div>

            </div>

        </div>

        <div class="buttons">
            <button class="edit">✎</button>
            <button class="reset">⟲</button>
        </div>

    </div>

</body>
</html>
