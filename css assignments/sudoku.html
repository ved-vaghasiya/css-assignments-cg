
<!DOCTYPE html>
<html>
<head>
    <title>Sudoku</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 3px;
        }

        table {
            border-collapse: collapse;
            border: 3px solid black;
        }

        td {
            width: 36px;
            height: 39px;
            border: 1px solid #999;
            text-align: center;
            font-size: 25px;
        }

        td:nth-child(3n) {
            border-right: 3px solid black;
        }

        tr:nth-child(3n) td {
            border-bottom: 3px solid black;
        }

        .green {
            background-color: #a5d6b8;
        }

    </style>
</head>

<body>

    <div class="container">
        <h1>SUDOKU</h1>

        <table>
            <tr>
                <td>8</td><td></td><td>6</td>
                <td class="green"></td><td class="green"></td><td class="green">3</td>
                <td></td><td>9</td><td></td>
            </tr>

            <tr>
                <td></td><td>4</td><td></td>
                <td class="green"></td><td class="green">1</td><td class="green"></td>
                <td></td><td>6</td><td>8</td>
            </tr>

            <tr>
                <td>2</td><td></td><td></td>
                <td class="green">8</td><td class="green">7</td><td class="green"></td>
                <td></td><td></td><td>5</td>
            </tr>

            <tr>
                <td class="green">1</td><td class="green"></td><td class="green">8</td>
                <td></td><td></td><td>5</td>
                <td class="green"></td><td class="green">2</td><td class="green"></td>
            </tr>

            <tr>
                <td class="green"></td><td class="green">3</td><td class="green"></td>
                <td>1</td><td></td><td></td>
                <td class="green"></td><td class="green">5</td><td class="green"></td>
            </tr>

            <tr>
                <td class="green">7</td><td class="green"></td><td class="green">5</td>
                <td></td><td>3</td><td></td>
                <td class="green">9</td><td class="green"></td><td class="green"></td>
            </tr>

            <tr>
                <td></td><td>2</td><td>1</td>
                <td class="green"></td><td class="green"></td><td class="green">7</td>
                <td></td><td>4</td><td></td>
            </tr>

            <tr>
                <td>6</td><td></td><td></td>
                <td class="green"></td><td class="green">2</td><td class="green"></td>
                <td></td><td>8</td><td></td>
            </tr>

            <tr>
                <td></td><td>8</td><td>7</td>
                <td class="green">6</td><td class="green"></td><td class="green">4</td>
                <td></td><td></td><td>3</td>
            </tr>
        </table>
    </div>


    <div class="container">
        <h1>ANSWER</h1>

        <table>
            <tr>
                <td>8</td><td>7</td><td>6</td>
                <td class="green">5</td><td class="green">4</td><td class="green">3</td>
                <td>1</td><td>9</td><td>2</td>
            </tr>

            <tr>
                <td>5</td><td>4</td><td>3</td>
                <td class="green">2</td><td class="green">1</td><td class="green">9</td>
                <td>7</td><td>6</td><td>8</td>
            </tr>

            <tr>
                <td>2</td><td>1</td><td>9</td>
                <td class="green">8</td><td class="green">7</td><td class="green">6</td>
                <td>4</td><td>3</td><td>5</td>
            </tr>

            <tr>
                <td class="green">1</td><td class="green">9</td><td class="green">8</td>
                <td>7</td><td>6</td><td>5</td>
                <td class="green">3</td><td class="green">2</td><td class="green">4</td>
            </tr>

            <tr>
                <td class="green">4</td><td class="green">3</td><td class="green">2</td>
                <td>1</td><td>9</td><td>8</td>
                <td class="green">6</td><td class="green">5</td><td class="green">7</td>
            </tr>

            <tr>
                <td class="green">7</td><td class="green">6</td><td class="green">5</td>
                <td>4</td><td>3</td><td>2</td>
                <td class="green">9</td><td class="green">8</td><td class="green">1</td>
            </tr>

            <tr>
                <td>3</td><td>2</td><td>1</td>
                <td class="green">9</td><td class="green">8</td><td class="green">7</td>
                <td>5</td><td>4</td><td>6</td>
            </tr>

            <tr>
                <td>6</td><td>5</td><td>4</td>
                <td class="green">3</td><td class="green">2</td><td class="green">1</td>
                <td>8</td><td>7</td><td>9</td>
            </tr>

            <tr>
                <td>9</td><td>8</td><td>7</td>
                <td class="green">6</td><td class="green">5</td><td class="green">4</td>
                <td>2</td><td>1</td><td>3</td>
            </tr>
        </table>
    </div>

</body>
</html>
