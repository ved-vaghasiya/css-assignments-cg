<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

     
        body {
            background-color: black;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
             
        }

        .calculator {
            width: 100%;
            max-width: 406px;
            padding: 28px;
            background-color: #1c1c1c;
            border-radius: 20px;
        }

        .display {
            width: 100%;
            height: 100px;
            color: white;
            font-size: 90px;
            text-align: right;
            margin-bottom: 14px;
            overflow: hidden;
        }


        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 01fr);
            gap: 11px 17px;
        }

        .button {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: none;
            border-radius: 60%;
            background-color: #505050;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        .light {
            background-color: #a5a5a5;
            color: #111;
        }


        .orange {
            background-color: #ff9500;
            color: white;
        }
        .zero {
            /* grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 50px;
            text-align: left;
            padding-left: 21px;
        } */

        /* @media (max-width: 350px) {
            .calculator {
                padding: 18px;
            }

            .buttons {
                gap: 10px;
            }

            .display {
                font-size: 65px;
            }

            .button {
                font-size: 18px;
            }
        } */
    </style>
</head>

<body>

    <div class="calculator">

        <div class="display">7744</div>

        <div class="buttons">

            <button class="button light">C</button>
            <button class="button light">+/-</button>
            <button class="button light">%</button>
            <button class="button orange">÷</button>

            <button class="button">7</button>
            <button class="button">8</button>
            <button class="button">9</button>
            <button class="button orange">x</button>

            <button class="button">4</button>
            <button class="button">5</button>
            <button class="button">6</button>
            <button class="button orange">-</button>

            <button class="button">1</button>
            <button class="button">2</button>
            <button class="button">3</button>
            <button class="button orange">+</button>

            <button class="button zero">0</button>
            <button class="button">,</button>
            <button class="button orange">=</button>

        </div>

    </div>

</body>
</html>
